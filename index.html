<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaSha.Online — Splash Screen & Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B2046;
      --navy-dark: #061329;
      --gold: #D69E3D;
      --gold-light: #F6D378;
      --bg: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: #1E293B;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================
       1. SPLASH SCREEN INTRO (PEMBUKA LOGIN)
       ========================================================== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #112347 0%, #061124 100%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                  visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Efek Grid Cyber Halus */
    .splash-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    /* Logo Box Pembuka */
    .splash-logo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Efek Aura Berpendar (Pulse Glow) */
    .splash-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(214, 158, 61, 0.45) 0%, rgba(11, 32, 70, 0) 70%);
      border-radius: 50%;
      filter: blur(28px);
      animation: glowPulse 2.8s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes glowPulse {
      0% { transform: scale(0.85); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    /* Foto Logo Asli dengan Animasi Fade In & Zoom Halus */
    .splash-logo-img {
      width: 175px;
      height: 175px;
      object-fit: contain;
      border-radius: 28px;
      background: #ffffff;
      padding: 10px;
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(214, 158, 61, 0.35);
      position: relative;
      z-index: 2;
      animation: logoReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    /* Garis Kilau (Shimmer) yang Melintas di Atas Logo */
    .splash-shimmer {
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        transparent
      );
      transform: skewX(-25deg);
      z-index: 3;
      border-radius: 28px;
      animation: shimmerSweep 1.8s ease 1.1s forwards;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% { left: -120%; }
      100% { left: 160%; }
    }

    /* Teks Pembuka ZaSha.Online */
    .splash-title {
      margin-top: 24px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      z-index: 2;
      opacity: 0;
      animation: textFadeIn 1.2s ease 0.6s forwards;
      text-align: center;
    }

    .splash-title span {
      background: linear-gradient(135deg, #F6D378 0%, #D69E3D 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-subtitle {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 2;
      opacity: 0;
      animation: textFadeIn 1.2s ease 0.9s forwards;
    }

    /* Loading Bar Elegan di Bagian Bawah */
    .splash-loader {
      margin-top: 28px;
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: textFadeIn 0.8s ease 1s forwards;
    }

    .splash-loader-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #D69E3D, #F6D378);
      border-radius: 99px;
      animation: loadProgress 2s ease-in-out 1.2s forwards;
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      60% { width: 75%; }
      100% { width: 100%; }
    }

    /* Keyframes Logo Masuk Perlahan */
    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.65) translateY(24px);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes textFadeIn {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* ==========================================================
       ANIMASI LOGO HOLOGRAM
       Urutan: HUD mengunci -> logo digambar sebagai hologram ->
       sinar pemindai mencetak logo asli -> gelombang kejut.
       Semua kelas diawali "zs-" supaya tidak bentrok dengan desain lain.
       ========================================================== */
    .zs-stage { position: relative; width: 175px; height: 175px; z-index: 2; }

    /* --- Kartu putih + logo asli: dibuka dari atas ke bawah oleh sinar pemindai --- */
    .zs-cardwrap {
      position: relative; z-index: 4; overflow: hidden; border-radius: 28px;
      -webkit-clip-path: inset(0 0 100% 0 round 28px 28px 0 0); clip-path: inset(0 0 100% 0 round 28px 28px 0 0);
      animation: zsCardScan 0.85s cubic-bezier(.45,0,.55,1) 2.15s forwards,
                 zsCardBump .5s cubic-bezier(.3,.7,.3,1) 3.0s;
    }
    .zs-logo { display: flex; align-items: center; justify-content: center; opacity: 1; animation: none; }
    .zs-mark { width: 100%; height: 100%; overflow: visible; }
    @keyframes zsCardScan {
      99.9% { -webkit-clip-path: inset(0 0 0 0 round 28px 28px 0 0); clip-path: inset(0 0 0 0 round 28px 28px 0 0); }
      100% { -webkit-clip-path: inset(0 0 0 0 round 28px); clip-path: inset(0 0 0 0 round 28px); }
    }
    @keyframes zsCardBump { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }

    /* --- Sinar pemindai + cahaya di belakangnya --- */
    .zs-beam {
      position: absolute; left: -20px; right: -20px; top: -1px; height: 2px; z-index: 6;
      border-radius: 2px; opacity: 0;
      background: linear-gradient(90deg, transparent, #F6D378 12%, #ffffff 50%, #F6D378 88%, transparent);
      box-shadow: 0 0 10px 2px rgba(246, 211, 120, .9), 0 0 26px 6px rgba(214, 158, 61, .55);
      animation: zsBeam 0.85s cubic-bezier(.45,0,.55,1) 2.15s both;
    }
    .zs-curtain {
      position: absolute; left: 0; right: 0; top: -44px; height: 44px; z-index: 5; opacity: 0;
      background: linear-gradient(to top, rgba(246, 211, 120, .6), rgba(246, 211, 120, 0));
      animation: zsBeam 0.85s cubic-bezier(.45,0,.55,1) 2.15s both;
    }
    @keyframes zsBeam {
      0% { transform: translateY(0); opacity: 0; }
      8%, 92% { opacity: 1; }
      100% { transform: translateY(175px); opacity: 0; }
    }
    .zs-flash {
      position: absolute; inset: 0; z-index: 6; opacity: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(246, 211, 120, .6));
      animation: zsFlash .55s ease-out 3.0s;
    }
    @keyframes zsFlash { 0% { opacity: 0; } 18% { opacity: .45; } 100% { opacity: 0; } }

    /* --- Hologram: dua lapis (biru untuk bagian navy, emas untuk bagian emas) --- */
    .zs-wire {
      position: absolute; left: 10px; top: 10px; width: 155px; height: 155px;
      overflow: visible; z-index: 3;
      animation: zsFlicker .3s linear 1.93s, zsGone .12s linear 3.0s forwards;
    }
    .zs-wire-n { color: #7FB5FF; filter: drop-shadow(0 0 2px rgba(127, 181, 255, .95)) drop-shadow(0 0 7px rgba(64, 128, 255, .75)); }
    .zs-wire-g { color: #F6D378; filter: drop-shadow(0 0 2px rgba(246, 211, 120, .95)) drop-shadow(0 0 7px rgba(214, 158, 61, .8)); }
    @keyframes zsFlicker { 0%, 100% { opacity: 1; } 20% { opacity: .45; } 40% { opacity: 1; } 60% { opacity: .65; } 80% { opacity: 1; } }
    @keyframes zsGone { to { opacity: 0; } }

    /* garis luar: digambar dari satu titik ke dua arah sekaligus */
    .zs-w {
      fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linejoin: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
    }
    .zs-fw { animation: zsArmF var(--t) cubic-bezier(.6,.05,.25,1) var(--d) forwards; }
    .zs-bw { animation: zsArmB var(--t) cubic-bezier(.6,.05,.25,1) var(--d) forwards; }
    @keyframes zsArmF { to { stroke-dashoffset: .5; } }
    @keyframes zsArmB { to { stroke-dashoffset: 1.5; } }

    /* isi tembus pandang setelah garis luar selesai */
    .zs-hf {
      fill: currentColor; fill-opacity: .17; stroke: currentColor; stroke-width: 3.2; stroke-linejoin: round;
      opacity: 0; animation: zsShow .3s ease var(--d) forwards;
    }
    @keyframes zsShow { to { opacity: 1; } }

    /* percikan putih di ujung garis yang sedang digambar */
    .zs-k { fill: none; stroke: #ffffff; stroke-width: 5.4; stroke-linecap: round; stroke-dasharray: .035 3; opacity: 0; }
    .zs-kf { animation: zsSparkF var(--t) cubic-bezier(.6,.05,.25,1) var(--d) both; }
    .zs-kb { animation: zsSparkB var(--t) cubic-bezier(.6,.05,.25,1) var(--d) both; }
    @keyframes zsSparkF {
      0% { stroke-dashoffset: 3.07; opacity: 0; } 5%, 90% { opacity: 1; }
      100% { stroke-dashoffset: 2.57; opacity: 0; }
    }
    @keyframes zsSparkB {
      0% { stroke-dashoffset: 2.035; opacity: 0; } 5%, 90% { opacity: 1; }
      100% { stroke-dashoffset: 2.535; opacity: 0; }
    }

    /* ekor cahaya: garis yang baru digambar masih "panas" (putih) lalu mendingin */
    .zs-kt { fill: none; stroke: #ffffff; stroke-width: 3.2; stroke-dasharray: .13 3; opacity: 0; }
    .zs-ktf { animation: zsTailF var(--t) cubic-bezier(.6,.05,.25,1) var(--d) both; }
    .zs-ktb { animation: zsTailB var(--t) cubic-bezier(.6,.05,.25,1) var(--d) both; }
    @keyframes zsTailF {
      0% { stroke-dashoffset: 3.26; opacity: 0; } 5%, 88% { opacity: .5; }
      100% { stroke-dashoffset: 2.76; opacity: 0; }
    }
    @keyframes zsTailB {
      0% { stroke-dashoffset: 2.13; opacity: 0; } 5%, 88% { opacity: .5; }
      100% { stroke-dashoffset: 2.63; opacity: 0; }
    }

    /* tulisan ZaSha.Online versi hologram */
    .zs-lt {
      fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
      animation: zsDraw .45s ease-in-out var(--d) forwards, zsLetterFill .35s ease var(--f) forwards;
    }
    @keyframes zsDraw { to { stroke-dashoffset: 0; } }
    @keyframes zsLetterFill { to { fill-opacity: .6; } }

    /* sirkuit: titik menyala -> garis menjalar -> denyut energi masuk ke logo */
    .zs-nd {
      fill: currentColor; transform-box: fill-box; transform-origin: center; transform: scale(0);
      animation: zsPop .4s cubic-bezier(.3, 1.7, .5, 1) var(--d) forwards;
    }
    .zs-pg {
      fill: none; stroke: currentColor; stroke-width: 2.5; opacity: 0;
      transform-box: fill-box; transform-origin: center;
      animation: zsPing .8s ease-out var(--d);
    }
    .zs-tr {
      fill: none; stroke: currentColor; stroke-width: 6; stroke-linejoin: round;
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
      animation: zsDraw .42s ease-out var(--d) forwards;
    }
    .zs-pl {
      fill: none; stroke: #ffffff; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: .2 3; opacity: 0;
      animation: zsPulse .5s ease-in var(--d) both;
    }
    @keyframes zsPop { to { transform: scale(1); } }
    @keyframes zsPing { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(3.6); } }
    @keyframes zsPulse {
      0% { stroke-dashoffset: 3.4; opacity: 0; } 10%, 85% { opacity: 1; }
      100% { stroke-dashoffset: 2.2; opacity: 0; }
    }

    /* denyut di titik sirkuit logo asli */
    .zs-ping {
      fill: none; stroke: #D69E3D; stroke-width: 3; opacity: 0;
      transform-box: fill-box; transform-origin: center;
      animation: zsPing .85s ease-out 3.10s;
    }
    .zs-ping-2 { animation-delay: 3.25s; }

    /* --- Garis tepi kartu --- */
    .zs-frame {
      position: absolute; left: 0; top: 0; width: 175px; height: 175px; z-index: 2; overflow: visible;
      fill: none; stroke: rgba(246, 211, 120, .5); stroke-width: 1.2;
      animation: zsGone .2s linear 3.0s forwards;
    }
    .zs-frame path {
      stroke-dasharray: 1 1; stroke-dashoffset: 1;
      animation: zsDraw .9s cubic-bezier(.6,.05,.25,1) .12s forwards;
    }

    /* --- HUD: sudut pembidik + cincin berputar --- */
    .zs-hud {
      position: absolute; left: -20px; top: -20px; width: 215px; height: 215px; z-index: 7; overflow: visible;
      fill: none; stroke: #F6D378; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 4px rgba(246, 211, 120, .7));
      opacity: 0;
      animation: zsHudIn .55s cubic-bezier(.2, .9, .3, 1.15) .05s forwards,
                 zsHudOut .6s cubic-bezier(.5, 0, .8, .4) 3.0s forwards;
    }
    .zs-tick { stroke-width: 1.5; opacity: .55; }
    @keyframes zsHudIn { 0% { opacity: 0; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes zsHudOut {
      0% { opacity: 1; transform: scale(1); } 22% { opacity: 1; transform: scale(.94); }
      100% { opacity: 0; transform: scale(1.16); }
    }
    .zs-rings {
      position: absolute; left: 50%; top: 50%; width: 270px; height: 270px; margin: -135px 0 0 -135px; z-index: 0;
      opacity: 0;
      animation: zsRingsIn .8s ease .1s forwards, zsRingsOut .7s ease-out 3.0s forwards;
    }
    .zs-rings svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; fill: none; }
    .zs-ring-a { stroke: rgba(246, 211, 120, .55); stroke-width: 1.2; animation: zsSpinA 6s linear forwards; }
    .zs-ring-b { stroke: rgba(127, 181, 255, .6); stroke-width: 1.5; stroke-linecap: round; animation: zsSpinB 6s linear forwards; }
    @keyframes zsRingsIn { 0% { opacity: 0; transform: scale(.82); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes zsRingsOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.22); } }
    @keyframes zsSpinA { to { transform: rotate(60deg); } }
    @keyframes zsSpinB { from { transform: rotate(20deg); } to { transform: rotate(-220deg); } }

    /* --- Gelombang kejut (bentuknya mengikuti kartu) --- */
    .zs-shock {
      position: absolute; left: -4px; top: -4px; right: -4px; bottom: -4px; z-index: 1;
      border-radius: 32px; border: 1.5px solid rgba(246, 211, 120, .95); opacity: 0;
      animation: zsShock .9s cubic-bezier(.2, .6, .3, 1) 3.0s;
    }
    .zs-shock-2 { border-color: rgba(127, 181, 255, .8); animation-duration: 1.15s; animation-delay: 3.12s; }
    @keyframes zsShock { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(1.8); } }

    .zs-wave {
      position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px; z-index: 0;
      border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, rgba(246, 211, 120, 0) 61%, rgba(246, 211, 120, .22) 66%, rgba(246, 211, 120, 0) 71%);
      animation: zsWave 1.25s cubic-bezier(.2, .6, .3, 1) 3.04s;
    }
    @keyframes zsWave { 0% { opacity: 1; transform: scale(.55); } 70% { opacity: .12; } 100% { opacity: 0; transform: scale(2.8); } }

    /* --- Waktu elemen lama digeser supaya tampil setelah logo terbentuk (bentuknya tidak diubah) --- */
    .splash-glow {
      opacity: 0;
      animation: zsGlowIn .6s ease-out 2.95s both,
                 glowPulse 2.8s ease-in-out 3.55s infinite alternate;
    }
    @keyframes zsGlowIn { 0% { opacity: 0; transform: scale(.5); } 100% { opacity: .4; transform: scale(.85); } }
    .zs-stage .splash-shimmer { animation-delay: 3.25s; }
    .splash-title { animation-delay: 3.10s; }
    .splash-subtitle { animation-delay: 3.30s; }
    .splash-loader { animation-delay: .3s; }
    .splash-loader-bar { animation-duration: 2.60s; animation-delay: .4s; }

    /* Dipakai tombol "Putar Ulang": matikan semua animasi sebentar supaya mulai dari awal */
    .splash-screen.zs-reset *,
    .splash-screen.zs-reset *::before,
    .splash-screen.zs-reset *::after { animation: none !important; }

    /* Saat Splash Screen Selesai: Menghilang Lembut */
    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ==========================================================
       2. HALAMAN LOGIN PELANGGAN (MUNCUL SETELAH LOGO)
       ========================================================== */
    .main-app {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      opacity: 0;
      transform: translateY(20px) scale(0.97);
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-app.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px rgba(11, 32, 70, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border: 1px solid #E2E8F0;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .mini-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(11, 32, 70, 0.1);
      margin-bottom: 12px;
    }

    .login-header h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
    }

    .login-header p {
      font-size: 13px;
      color: #64748B;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(214, 158, 61, 0.18);
    }

    .form-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 22px;
      color: #64748B;
    }

    .form-extra a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    .form-extra a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--navy) 0%, #17376D 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(11, 32, 70, 0.25);
      transition: all 0.2s;
    }

    .btn-login:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    /* Tombol Replay Animasi */
    .replay-wrap {
      margin-top: 18px;
      text-align: center;
    }

    .btn-replay {
      background: none;
      border: 1px dashed #94A3B8;
      color: #64748B;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-replay:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(214, 158, 61, 0.05);
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       SPLASH SCREEN PEMBUKA LOGO (FADE-IN PERLAHAN)
       ========================================================== -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo-wrap">
      <div class="splash-glow"></div>

  <!-- ==========================================================
       HALAMAN LOGIN PELANGGAN (MUNCUL OTOMATIS)
       ========================================================== -->
  <main class="main-app" id="mainApp">
    <div class="login-card">
      <div class="login-header">
        <img src="./logo.jpg" alt="ZaSha.Online" class="mini-logo">
        <h2>Selamat Datang</h2>
        <p>Silakan masuk ke akun ZaSha.Online Anda</p>
      </div>

      <form onsubmit="event.preventDefault(); alert('Demo login berhasil!');">
        <div class="form-group">
          <label for="username">Username atau Email</label>
          <input type="text" id="username" placeholder="Masukkan username" required value="pelanggan@zasha.online">
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="••••••••" required value="12345678">
        </div>

        <div class="form-extra">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked> Ingat saya
          </label>
          <a href="#">Lupa sandi?</a>
        </div>

        <button type="submit" class="btn-login">Masuk Sekarang</button>
      </form>
    </div>

    <div class="replay-wrap">
      <button class="btn-replay" onclick="playSplash()">↺ Putar Ulang Animasi Pembuka</button>
    </div>
  </main>

  <script>
    // Kecepatan animasi pembuka: 1 = normal, 0.8 = lebih lambat, 1.3 = lebih cepat
    const KECEPATAN = 1;

    function aturKecepatan() {
      const splash = document.getElementById('splashScreen');
      if (KECEPATAN === 1 || !splash.getAnimations) return;
      splash.getAnimations({ subtree: true }).forEach(a => { a.playbackRate = KECEPATAN; });
    }

    // Fungsi untuk transisi dari Splash Screen ke Form Login
    function startApp() {
      // Waktu tayang logo pembuka (5 detik) sebelum berpindah ke login
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        const app = document.getElementById('mainApp');
        
        splash.classList.add('hidden');
        app.classList.add('show');
      }, 5000 / KECEPATAN);
    }

    // Fungsi putar ulang animasi pembuka
    function playSplash() {
      const splash = document.getElementById('splashScreen');
      const app = document.getElementById('mainApp');
      
      app.classList.remove('show');
      splash.classList.remove('hidden');

      // Reset semua animasi splash: matikan sebentar, lalu hidupkan lagi dari awal
      splash.classList.add('zs-reset');
      void splash.offsetWidth; // Trigger reflow
      splash.classList.remove('zs-reset');
      aturKecepatan();

      startApp();
    }

    // Jalankan saat pertama kali dibuka
    aturKecepatan();
    window.addEventListener('load', startApp);
  </script>
